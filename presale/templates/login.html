{% extends "base.html" %}
{% block title %}Вход — Предрасчёт{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="card login-card">
    <h1>Вход</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <label class="field"><span>Логин</span><input name="login" required autofocus style="width:100%"></label>
      <label class="field"><span>Пароль</span><input name="password" type="password" required style="width:100%"></label>
      <button class="btn" type="submit">Войти</button>
    </form>
  </div>
</div>
{% endblock %}
